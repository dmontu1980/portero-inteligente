<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">Portero inteligente</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg:#eef0f4;
    --surface:#ffffff;
    --surface-alt:#f7f8fb;
    --text:#1a1d24;
    --text-muted:#5b6472;
    --border:#dadfe6;
    --border-strong:#c3c9d3;
    --accent:#4a5fe8;
    --accent-contrast:#ffffff;
    --whatsapp:#128c7e;
    --whatsapp-hover:#0f766a;
    --focus:#4a5fe8;
    --shadow: 0 1px 2px rgba(20,23,30,.04), 0 8px 24px -8px rgba(20,23,30,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151b;
      --surface:#1c2028;
      --surface-alt:#232833;
      --text:#edeff3;
      --text-muted:#9aa3b2;
      --border:#2e333d;
      --border-strong:#3a4049;
      --accent:#7684ff;
      --accent-contrast:#0d0f14;
      --whatsapp:#1fae7e;
      --whatsapp-hover:#28c98f;
      --focus:#7684ff;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151b;
    --surface:#1c2028;
    --surface-alt:#232833;
    --text:#edeff3;
    --text-muted:#9aa3b2;
    --border:#2e333d;
    --border-strong:#3a4049;
    --accent:#7684ff;
    --accent-contrast:#0d0f14;
    --whatsapp:#1fae7e;
    --whatsapp-hover:#28c98f;
    --focus:#7684ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(80vw 60vh at 50% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
      repeating-linear-gradient(115deg, color-mix(in srgb, var(--text) 2%, transparent) 0 2px, transparent 2px 26px),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: clamp(16px, 4vw, 48px) 16px 40px;
  }
  h1,h2,h3{font-family:'Sora', ui-sans-serif, system-ui, sans-serif; margin:0; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .app{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .plate{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  header.top{
    padding:22px 22px 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
  }
  header.top h1{font-size:21px; font-weight:700;}
  header.top .addr{color:var(--text-muted); font-size:13.5px;}

  .search-wrap{padding:14px 18px 8px;}
  .search{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-alt);
    border:1px solid var(--border);
    border-radius:12px;
    padding:9px 12px;
  }
  .search svg{flex:none; color:var(--text-muted);}
  .search input{
    border:none;
    background:transparent;
    width:100%;
    font-size:15px;
    color:var(--text);
    font-family:inherit;
  }
  .search input:focus{outline:none;}
  .search input::placeholder{color:var(--text-muted);}

  .directory{
    padding:6px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
    max-height:52vh;
    overflow-y:auto;
  }
  .floor-group{display:flex; flex-direction:column; gap:8px;}
  .floor-group .floor-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-muted);
    padding:6px 2px;
    position:sticky;
    top:0;
    background:var(--surface);
  }
  .units{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .units-2{grid-template-columns:repeat(2, 1fr);}
  .units-solo{display:flex; justify-content:center;}
  .units-solo .unit{width:min(100%, 160px);}
  .unit{
    background:var(--surface-alt);
    border:1px solid var(--border);
    border-radius:12px;
    padding:17px 6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:border-color .12s ease, transform .12s ease, background .12s ease;
  }
  .unit:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .unit:active{transform:translateY(0);}
  .unit .code{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:18px;}
  .no-results{color:var(--text-muted); font-size:13.5px; padding:10px 2px;}

  footer.foot{
    padding:12px 18px 16px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--accent);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    padding:4px 2px;
  }
  .link-btn:hover{text-decoration:underline;}

  /* Detail sheet */
  .sheet-backdrop{
    position:fixed; inset:0;
    background:color-mix(in srgb, black 45%, transparent);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease;
    z-index:50;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%;
    max-width:380px;
    max-height:calc(100% - 12px);
    overflow-y:auto;
    background:var(--surface);
    border-radius:20px;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:22px;
    transform:translateY(10px) scale(.97);
    transition:transform .18s ease, opacity .18s ease;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .sheet-backdrop.open .sheet{transform:translateY(0) scale(1);}
  .sheet-head{display:flex; align-items:center; gap:12px;}
  .avatar{
    width:46px; height:46px; border-radius:50%;
    background:color-mix(in srgb, var(--accent) 16%, var(--surface-alt));
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora'; font-weight:700; font-size:17px;
    flex:none;
  }
  .sheet-head .id{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-muted);}
  .sheet-head h2{font-size:18px;}
  .close-x{
    margin-left:auto;
    background:var(--surface-alt);
    border:1px solid var(--border);
    border-radius:50%;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  .pending-msg{
    margin:0;
    text-align:center;
    background:var(--surface-alt);
    border:1px dashed var(--border-strong);
    border-radius:10px;
    padding:18px 14px;
  }
  .pending-msg strong{display:block; font-size:15px; color:var(--text); margin-bottom:4px;}
  .pending-msg span{font-size:12.5px; color:var(--text-muted);}

  .contact-list{display:flex; flex-direction:column; gap:8px;}
  .contact-btn{
    display:flex; align-items:center; gap:12px;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface-alt);
    cursor:pointer;
    text-align:left;
    font-family:inherit;
  }
  .contact-btn:hover{border-color:var(--border-strong);}
  .contact-btn .num{
    width:28px; height:28px; border-radius:50%; flex:none;
    background:color-mix(in srgb, var(--accent) 16%, var(--surface));
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:13px;
  }
  .contact-btn .label{font-size:14.5px; font-weight:600;}
  .contact-btn svg{margin-left:auto; flex:none; color:var(--text-muted);}

  .back-link{
    align-self:flex-start;
    background:none; border:none;
    color:var(--accent);
    font-size:12.5px; font-weight:600;
    cursor:pointer;
    padding:2px;
    margin-top:-8px;
  }
  .back-link:hover{text-decoration:underline;}

  [hidden]{display:none !important;}

  .field label{
    display:block;
    font-size:11.5px;
    color:var(--text-muted);
    margin-bottom:5px;
    font-weight:500;
  }
  .field input{
    width:100%;
    border:1px solid var(--border);
    background:var(--surface-alt);
    border-radius:10px;
    padding:10px 12px;
    font-size:14.5px;
    color:var(--text);
    font-family:inherit;
  }
  .field input:focus{outline:none; border-color:var(--focus);}

  .actions{display:flex; flex-direction:column; gap:10px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:13px 16px;
    border-radius:12px;
    font-weight:600;
    font-size:15px;
    border:1px solid transparent;
    cursor:pointer;
    text-decoration:none;
  }
  .btn svg{flex:none;}
  .btn.whatsapp{background:var(--whatsapp); color:#fff;}
  .btn.whatsapp:hover{background:var(--whatsapp-hover);}
  .btn.call{background:var(--accent); color:var(--accent-contrast);}
  .btn.call:hover{filter:brightness(1.08);}

  /* QR / print panel */
  .qr-backdrop{
    position:fixed; inset:0;
    background:color-mix(in srgb, black 45%, transparent);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease;
    z-index:60;
  }
  .qr-backdrop.open{opacity:1; pointer-events:auto;}
  .qr-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:26px 26px 20px;
    max-width:320px;
    width:100%;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .qr-card h3{font-size:16px; line-height:1.3;}
  .qr-caption{font-size:11.5px; color:var(--text-muted); margin-top:-4px;}
  #qrcode{padding:10px; background:#fff; border-radius:10px; margin:6px 0;}
  .qr-steps{font-size:12px; color:var(--text-muted); line-height:1.7;}
  .qr-actions{display:flex; gap:8px; margin-top:6px; width:100%;}
  .qr-actions button{
    flex:1;
    padding:9px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface-alt);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .qr-actions button.primary{background:var(--accent); color:var(--accent-contrast); border-color:transparent;}

  @media print{
    body *{visibility:hidden;}
    .qr-card, .qr-card *{visibility:visible;}
    .qr-card{position:fixed; inset:0; margin:auto; box-shadow:none; border:none;}
    .qr-actions{display:none;}
  }

  @media (max-width:600px){
    body{padding:0;}
    .app{max-width:100%; gap:0; min-height:100dvh;}
    .plate{border-radius:0; border-left:none; border-right:none; min-height:100dvh;}
    header.top{padding-top:max(22px, calc(env(safe-area-inset-top) + 14px));}
    .directory{max-height:none; flex:1; min-height:0;}
    footer.foot{padding-bottom:max(16px, calc(env(safe-area-inset-bottom) + 10px));}
  }

  html.lock, html.lock body{overflow:hidden; height:100%;}
</style>

<script>
(function(){
  // ---- Directorio del edificio (se carga desde Firestore) ----------------
  // Cada unidad tiene: piso, label (nombre del piso), codigo (letra o ''), orden, contactos.
  // contactos: lista de personas para contactar en esa unidad (puede venir vacía []).
  //   Cada contacto: { whatsapp, telefono }
  let directorio = [];

  const directoryEl = document.getElementById('directory');
  const searchEl = document.getElementById('search');

  function unitButton(floor, u){
    const btn = document.createElement('button');
    btn.className='unit';
    btn.type='button';
    btn.innerHTML = '<span class="code">'+floor.piso+u.codigo+'</span>';
    btn.addEventListener('click', ()=>openSheet(floor, u));
    return btn;
  }

  function render(filter){
    const q = (filter||'').trim().toLowerCase();
    directoryEl.innerHTML = '';
    let any = false;
    directorio.forEach(floor=>{
      const matches = floor.unidades.filter(u=>{
        if(!q) return true;
        return (floor.piso+u.codigo).toLowerCase().includes(q);
      });
      if(matches.length===0) return;
      any = true;
      const group = document.createElement('div');
      group.className='floor-group';
      const label = document.createElement('div');
      label.className='floor-label';
      label.textContent = floor.label;
      group.appendChild(label);

      if(matches.length<=2){
        const row = document.createElement('div');
        row.className = matches.length===1 ? 'units units-solo' : 'units units-2';
        matches.forEach(u=>row.appendChild(unitButton(floor, u)));
        group.appendChild(row);
      } else {
        // Fila 1: unidades de frente (las primeras 2). Fila 2: contrafrente (el resto).
        const frente = document.createElement('div');
        frente.className = 'units units-2';
        matches.slice(0,2).forEach(u=>frente.appendChild(unitButton(floor, u)));
        group.appendChild(frente);

        const contra = document.createElement('div');
        contra.className = 'units';
        matches.slice(2).forEach(u=>contra.appendChild(unitButton(floor, u)));
        group.appendChild(contra);
      }

      directoryEl.appendChild(group);
    });
    if(!any){
      directoryEl.innerHTML = '<div class="no-results">Sin resultados para "'+filter+'".</div>';
    }
  }
  searchEl.addEventListener('input', e=>render(searchEl.value));

  // ---- Edificio a mostrar (multi-edificio vía ?edificio=) ------------
  // Si el link no trae el parámetro (QR viejo, o entrada directa), se usa
  // rioja1244 por defecto para no romper el cartel ya impreso.
  const params = new URLSearchParams(window.location.search);
  const edificioId = params.get('edificio') || 'rioja1244';

  const buildingNameEl = document.getElementById('buildingName');
  const buildingAddrEl = document.getElementById('buildingAddr');
  const qrBuildingNameEl = document.getElementById('qrBuildingName');
  const pageTitleEl = document.getElementById('pageTitle');

  // ---- Carga del edificio + directorio desde Firestore ---------------
  directoryEl.innerHTML = '<div class="no-results">Cargando directorio…</div>';
  const db = firebase.firestore();
  const edificioRef = db.collection('edificios').doc(edificioId);

  edificioRef.get().then(edSnap=>{
    if(!edSnap.exists){
      buildingNameEl.textContent = 'Edificio no encontrado';
      buildingAddrEl.textContent = 'Revisá el link del cartel QR.';
      qrBuildingNameEl.textContent = 'Edificio no encontrado';
      directoryEl.innerHTML = '<div class="no-results">No encontramos este edificio. Consultá con la administración.</div>';
      return;
    }
    const ed = edSnap.data();
    const nombre = ed.nombre || edificioId;
    buildingNameEl.textContent = nombre;
    buildingAddrEl.textContent = ed.direccion || 'Elegí un departamento para contactarlo';
    qrBuildingNameEl.textContent = nombre;
    pageTitleEl.textContent = nombre;
    document.title = nombre;

    return edificioRef.collection('unidades').get().then(snap=>{
      const porPiso = {}; // piso -> {label, pisoOrden, unidades:[]}
      snap.forEach(doc=>{
        const d = doc.data();
        if(!porPiso[d.piso]) porPiso[d.piso] = { piso:d.piso, label:d.label, pisoOrden:d.pisoOrden, unidades:[] };
        porPiso[d.piso].unidades.push({ codigo:d.codigo||'', contactos:d.contactos||[] });
      });
      directorio = Object.values(porPiso).sort((a,b)=>a.pisoOrden-b.pisoOrden);
      directorio.forEach(floor=>floor.unidades.sort((a,b)=>a.codigo.localeCompare(b.codigo)));
      render(searchEl.value);
    });
  }).catch(err=>{
    console.error('Error cargando directorio de Firestore:', err);
    directoryEl.innerHTML = '<div class="no-results">No se pudo cargar el directorio. Revisá tu conexión y volvé a intentar.</div>';
  });

  // ---- Detail sheet -------------------------------------------------
  const sheetBackdrop = document.getElementById('sheetBackdrop');
  const sheetAvatar = document.getElementById('sheetAvatar');
  const sheetId = document.getElementById('sheetId');
  const sheetTitle = document.getElementById('sheetTitle');
  const pendingMsg = document.getElementById('pendingMsg');
  const contactList = document.getElementById('contactList');
  const backToList = document.getElementById('backToList');
  const sheetField = document.getElementById('sheetField');
  const sheetActions = document.getElementById('sheetActions');
  const visitorName = document.getElementById('visitorName');
  const btnWhatsapp = document.getElementById('btnWhatsapp');
  const btnCall = document.getElementById('btnCall');
  let current = null; // {floor, u, contactIndex}

  const personIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

  function updateLinks(){
    if(!current || current.contactIndex==null) return;
    const contacto = current.u.contactos[current.contactIndex];
    const name = visitorName.value.trim();
    const who = name ? name : 'un visitante';
    const ubicacion = 'Piso ' + current.floor.piso + (current.u.codigo ? ', Depto ' + current.u.codigo : '');
    const msg = 'Hola! Soy ' + who + ' y estoy en la puerta del edificio (' + ubicacion + '). ¿Podés iniciar una videollamada de WhatsApp para verme y abrirme la puerta?';
    btnWhatsapp.href = 'https://wa.me/' + contacto.whatsapp + '?text=' + encodeURIComponent(msg);
    btnCall.href = 'tel:' + contacto.telefono;
  }

  function showContactDetail(index){
    current.contactIndex = index;
    const multiple = current.u.contactos.length > 1;
    sheetTitle.textContent = multiple ? 'Contacto ' + (index+1) : 'Contactar';
    contactList.hidden = true;
    backToList.hidden = !multiple;
    sheetField.hidden = false;
    sheetActions.hidden = false;
    visitorName.value = '';
    updateLinks();
    setTimeout(()=>visitorName.focus(), 150);
  }

  function showContactPicker(){
    current.contactIndex = null;
    sheetTitle.textContent = 'Elegí un contacto';
    backToList.hidden = true;
    sheetField.hidden = true;
    sheetActions.hidden = true;
    contactList.innerHTML = '';
    current.u.contactos.forEach((c, i)=>{
      const b = document.createElement('button');
      b.className = 'contact-btn';
      b.type = 'button';
      b.innerHTML = '<span class="num">'+(i+1)+'</span><span class="label">Contacto '+(i+1)+'</span>'+personIcon;
      b.addEventListener('click', ()=>showContactDetail(i));
      contactList.appendChild(b);
    });
    contactList.hidden = false;
  }

  function openSheet(floor, u){
    current = {floor, u, contactIndex:null};
    const total = u.contactos.length;
    const ubicacion = 'Piso ' + floor.piso + (u.codigo ? ' · Depto ' + u.codigo : '');
    sheetAvatar.textContent = (floor.piso + u.codigo).trim().charAt(0).toUpperCase();
    sheetId.textContent = ubicacion;
    sheetId.hidden = false;
    pendingMsg.hidden = total > 0;
    contactList.hidden = true;
    backToList.hidden = true;
    sheetField.hidden = true;
    sheetActions.hidden = true;
    if(total === 0){
      sheetId.hidden = true;
      sheetTitle.textContent = ubicacion;
      btnWhatsapp.href = '#';
      btnCall.href = '#';
    } else if(total === 1){
      showContactDetail(0);
    } else {
      showContactPicker();
    }
    sheetBackdrop.classList.add('open');
    document.documentElement.classList.add('lock');
  }
  function closeSheet(){
    sheetBackdrop.classList.remove('open');
    document.documentElement.classList.remove('lock');
    current=null;
  }
  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  sheetBackdrop.addEventListener('click', e=>{ if(e.target===sheetBackdrop) closeSheet(); });
  backToList.addEventListener('click', showContactPicker);
  visitorName.addEventListener('input', updateLinks);

  // ---- QR / print panel ----------------------------------------------
  const qrBackdrop = document.getElementById('qrBackdrop');
  const qrDiv = document.getElementById('qrcode');
  let qrBuilt = false;
  document.getElementById('showQr').addEventListener('click', ()=>{
    qrBackdrop.classList.add('open');
    document.documentElement.classList.add('lock');
    if(!qrBuilt && window.QRCode){
      new QRCode(qrDiv, {
        text: window.location.href,
        width: 180,
        height: 180,
        colorDark: '#12151b',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      qrBuilt = true;
    }
  });
  function closeQr(){ qrBackdrop.classList.remove('open'); document.documentElement.classList.remove('lock'); }
  document.getElementById('closeQr').addEventListener('click', closeQr);
  qrBackdrop.addEventListener('click', e=>{ if(e.target===qrBackdrop) closeQr(); });
  document.getElementById('printQr').addEventListener('click', ()=>window.print());
})();
</script>

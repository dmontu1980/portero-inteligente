<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Portero inteligente</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg:#eef0f4; --surface:#ffffff; --surface-alt:#f7f8fb;
    --text:#1a1d24; --text-muted:#5b6472; --border:#dadfe6; --border-strong:#c3c9d3;
    --accent:#4a5fe8; --accent-contrast:#ffffff;
    --danger:#c0392b; --danger-bg:#fbe9e7;
    --ok:#128c7e;
    --shadow: 0 1px 2px rgba(20,23,30,.04), 0 8px 24px -8px rgba(20,23,30,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151b; --surface:#1c2028; --surface-alt:#232833;
      --text:#edeff3; --text-muted:#9aa3b2; --border:#2e333d; --border-strong:#3a4049;
      --accent:#7684ff; --accent-contrast:#0d0f14;
      --danger:#ff6b5e; --danger-bg:#3a2220;
      --ok:#1fae7e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -10px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Sora', ui-sans-serif, system-ui, sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  button, input{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---- Login ---- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; box-shadow:var(--shadow); padding:28px;
    display:flex; flex-direction:column; gap:14px;
  }
  .login-card h1{font-size:19px;}
  .login-card .sub{font-size:13px; color:var(--text-muted); margin-top:-8px;}
  .field label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:500;}
  .field input{
    width:100%; border:1px solid var(--border); background:var(--surface-alt);
    border-radius:9px; padding:10px 12px; font-size:14.5px; color:var(--text);
  }
  .field input:focus{outline:none; border-color:var(--accent);}
  .btn{
    padding:11px 16px; border-radius:10px; font-weight:600; font-size:14.5px;
    border:1px solid transparent; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--accent-contrast);}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-ghost{background:var(--surface-alt); border-color:var(--border); color:var(--text);}
  .btn-ghost:hover{border-color:var(--border-strong);}
  .btn-danger{background:none; color:var(--danger); border:none; font-size:13px; padding:6px 8px;}
  .error-msg{font-size:13px; color:var(--danger); background:var(--danger-bg); border-radius:8px; padding:8px 10px;}

  /* ---- App shell ---- */
  #appScreen{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
  .top-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px;}
  .top-bar h1{font-size:18px;}
  .top-bar .who{font-size:12px; color:var(--text-muted);}
  .actions-row{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .status-msg{font-size:13px; color:var(--text-muted); margin-bottom:14px;}

  .floor-section{margin-bottom:22px;}
  .floor-section h2{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:8px;
  }
  .unit-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; margin-bottom:8px; cursor:pointer;
  }
  .unit-row:hover{border-color:var(--border-strong);}
  .unit-row .code{font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:15px; width:56px; flex:none;}
  .unit-row .status{font-size:12.5px; flex:1;}
  .unit-row .status.ok{color:var(--ok);}
  .unit-row .status.empty{color:var(--text-muted);}
  .unit-row .chev{color:var(--text-muted); flex:none;}

  /* ---- Edit modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:color-mix(in srgb, black 45%, transparent);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:50;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal{
    width:100%; max-width:420px; max-height:calc(100% - 12px); overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow); padding:22px; display:flex; flex-direction:column; gap:16px;
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between;}
  .modal-head h2{font-size:17px;}
  .contact-row{
    display:flex; gap:8px; align-items:flex-end; border:1px solid var(--border);
    border-radius:10px; padding:12px; background:var(--surface-alt);
  }
  .contact-row .fields{flex:1; display:flex; flex-direction:column; gap:8px;}
  #contactosWrap{display:flex; flex-direction:column; gap:10px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:4px;}

  [hidden]{display:none !important;}
</style>
</head>
<body>

<div id="loginScreen">
  <form class="login-card" id="loginForm">
    <div>
      <h1>Panel de administración</h1>
      <div class="sub">Portero inteligente</div>
    </div>
    <div class="field">
      <label for="loginEmail">Usuario</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPass">Contraseña</label>
      <input id="loginPass" type="password" autocomplete="current-password" required>
    </div>
    <p class="error-msg" id="loginError" hidden></p>
    <button class="btn btn-primary" type="submit">Iniciar sesión</button>
  </form>
</div>

<div id="onboardScreen" hidden>
  <div class="login-card" style="max-width:420px; margin:60px auto;">
    <div>
      <h1>Tu usuario no tiene un edificio asignado</h1>
      <div class="sub" id="onboardWho"></div>
    </div>
    <p class="status-msg" id="onboardMsg">Si administrás Rioja 1244 y todavía no migraste los datos a la nueva estructura, podés hacerlo con este botón (se hace una sola vez).</p>
    <button class="btn btn-primary" id="migrateBtn" type="button">Migrar Rioja 1244 y asignarme este edificio</button>
    <button class="btn btn-ghost" id="logoutBtnOnboard" type="button">Cerrar sesión</button>
  </div>
</div>

<div id="appScreen" hidden>
  <div class="top-bar">
    <div>
      <h1 id="topBarTitle">Directorio</h1>
      <div class="who" id="whoAmI"></div>
    </div>
    <button class="btn btn-ghost" id="logoutBtn" type="button">Cerrar sesión</button>
  </div>

  <div class="actions-row">
    <button class="btn btn-ghost" id="seedBtn" type="button">Inicializar estructura del edificio</button>
    <button class="btn btn-ghost" id="downloadTemplateBtn" type="button">Descargar planilla actual (CSV)</button>
    <button class="btn btn-primary" id="importBtn" type="button">Importar planilla (CSV)</button>
    <input type="file" id="importFile" accept=".csv,text/csv" hidden>
    <a class="btn btn-ghost" id="publicAppLink" href="./" target="_blank" style="text-decoration:none; display:inline-flex; align-items:center;">Ver app pública ↗</a>
  </div>

  <p class="status-msg" id="statusMsg"></p>

  <div id="floors"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Unidad</h2>
      <button class="btn-danger" id="modalClose" type="button" style="font-size:20px; line-height:1;">×</button>
    </div>
    <div id="contactosWrap"></div>
    <button class="btn btn-ghost" id="addContactoBtn" type="button">+ Agregar contacto</button>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel" type="button">Cancelar</button>
      <button class="btn btn-primary" id="modalSave" type="button">Guardar</button>
    </div>
  </div>
</div>

<script>
(function(){
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---- Estructura de Rioja 1244 (solo para la migración inicial, una vez) ----
  const RIOJA_PISOS = [
    { piso:'PB', label:'Planta Baja', codigos:[''] },
    { piso:'EP', label:'Entrepiso', codigos:[''] },
  ];
  for(let p=1; p<=10; p++){
    RIOJA_PISOS.push({ piso:p+'°', label:'Piso '+p, codigos:['A','B','C','D','E'] });
  }
  function docId(piso, codigo){ return piso.replace('°','') + codigo; }

  // ---- Estado del edificio del admin logueado (se arma dinámicamente) ----
  let edificioId = null;
  let edificioRef = null;
  let floorDefs = [];    // [{piso,label,codigos,pisoOrden}] — viene de edificios/{id}.pisos
  let floorLookup = {};  // piso "plano" (sin °) -> {storedPiso,label,pisoOrden}

  // El campo "pisos" del edificio puede ser un array nativo de Firestore
  // (como lo escribe la migración) o, para cargarlo a mano en la consola sin
  // tener que crear decenas de campos anidados, un string con el JSON del array.
  function getPisosArray(ed){
    if(Array.isArray(ed.pisos)) return ed.pisos;
    if(typeof ed.pisos === 'string'){
      try { return JSON.parse(ed.pisos); }
      catch(e){ console.error('El campo "pisos" no es un JSON válido:', e); return []; }
    }
    return [];
  }

  function setFloorDefs(pisos){
    floorDefs = (pisos||[]).map((f,i)=>({ piso:f.piso, label:f.label, codigos:f.codigos||[], pisoOrden:i*10 }));
    floorLookup = {};
    floorDefs.forEach(f=>{ floorLookup[f.piso.replace('°','')] = { storedPiso:f.piso, label:f.label, pisoOrden:f.pisoOrden }; });
  }

  // ---- Login ----
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const onboardScreen = document.getElementById('onboardScreen');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const whoAmI = document.getElementById('whoAmI');
  const topBarTitle = document.getElementById('topBarTitle');
  const publicAppLink = document.getElementById('publicAppLink');

  loginForm.addEventListener('submit', e=>{
    e.preventDefault();
    loginError.hidden = true;
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    auth.signInWithEmailAndPassword(email, pass).catch(err=>{
      loginError.textContent = 'No se pudo iniciar sesión: ' + (err.message || err.code);
      loginError.hidden = false;
    });
  });
  document.getElementById('logoutBtn').addEventListener('click', ()=>auth.signOut());
  document.getElementById('logoutBtnOnboard').addEventListener('click', ()=>auth.signOut());

  auth.onAuthStateChanged(async user=>{
    if(!user){
      loginScreen.hidden = false;
      appScreen.hidden = true;
      onboardScreen.hidden = true;
      return;
    }
    loginScreen.hidden = true;
    document.getElementById('onboardWho').textContent = 'Conectado como ' + user.email;
    try{
      const adminSnap = await db.collection('admins').doc(user.uid).get();
      if(!adminSnap.exists || !adminSnap.data().edificioId){
        appScreen.hidden = true;
        onboardScreen.hidden = false;
        return;
      }
      edificioId = adminSnap.data().edificioId;
      edificioRef = db.collection('edificios').doc(edificioId);
      const edSnap = await edificioRef.get();
      if(!edSnap.exists){
        appScreen.hidden = true;
        onboardScreen.hidden = false;
        document.getElementById('onboardMsg').textContent = 'Tu usuario está asignado al edificio "' + edificioId + '" pero no encontramos sus datos. Avisá al administrador del sistema.';
        document.getElementById('migrateBtn').hidden = true;
        return;
      }
      onboardScreen.hidden = true;
      appScreen.hidden = false;
      const ed = edSnap.data();
      setFloorDefs(getPisosArray(ed));
      whoAmI.textContent = 'Conectado como ' + user.email;
      topBarTitle.textContent = 'Directorio — ' + (ed.nombre || edificioId);
      publicAppLink.href = './?edificio=' + encodeURIComponent(edificioId);
      loadUnidades();
    } catch(err){
      console.error(err);
      appScreen.hidden = true;
      onboardScreen.hidden = false;
      document.getElementById('onboardMsg').textContent = 'Error: ' + err.message;
    }
  });

  // ---- Migración única: Rioja 1244 a la estructura multi-edificio ----
  document.getElementById('migrateBtn').addEventListener('click', async ()=>{
    const user = auth.currentUser;
    if(!user) return;
    const msgEl = document.getElementById('onboardMsg');
    if(!confirm('Esto te va a asignar el edificio "Rioja 1244" y va a copiar sus unidades a la nueva estructura. ¿Continuar?')) return;
    msgEl.textContent = 'Migrando…';
    try{
      // 1) Autoasignación (permitida una sola vez por las reglas de seguridad)
      await db.collection('admins').doc(user.uid).set({ edificioId: 'rioja1244' });

      // 2) Datos del edificio (nombre y estructura de pisos/unidades)
      await db.collection('edificios').doc('rioja1244').set({
        nombre: 'Rioja 1244 - Edificio Chicago I',
        direccion: '',
        pisos: RIOJA_PISOS,
      }, { merge:true });

      // 3) Copiar las unidades de la colección vieja a la subcolección nueva
      const oldSnap = await db.collection('unidades').get();
      const batch = db.batch();
      oldSnap.forEach(doc=>{
        const ref = db.collection('edificios').doc('rioja1244').collection('unidades').doc(doc.id);
        batch.set(ref, doc.data(), { merge:true });
      });
      await batch.commit();

      msgEl.textContent = 'Listo. Recargando…';
      setTimeout(()=>window.location.reload(), 800);
    } catch(err){
      console.error(err);
      msgEl.textContent = 'Error al migrar: ' + err.message;
    }
  });

  // ---- Inicializar estructura (crea solo lo que falta) ----
  document.getElementById('seedBtn').addEventListener('click', async ()=>{
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.textContent = 'Inicializando…';
    let creadas = 0, existentes = 0;
    for(let i=0; i<floorDefs.length; i++){
      const f = floorDefs[i];
      for(const codigo of f.codigos){
        const ref = edificioRef.collection('unidades').doc(docId(f.piso, codigo));
        const snap = await ref.get();
        if(!snap.exists){
          await ref.set({ piso:f.piso, label:f.label, codigo, pisoOrden:f.pisoOrden, contactos:[] });
          creadas++;
        } else {
          existentes++;
        }
      }
    }
    statusMsg.textContent = 'Listo — unidades creadas: ' + creadas + ', ya existían: ' + existentes + '.';
    loadUnidades();
  });

  // ---- Descargar planilla CSV con los contactos ya guardados (una fila por contacto) ----
  document.getElementById('downloadTemplateBtn').addEventListener('click', ()=>{
    const lines = ['piso,codigo,whatsapp,telefono'];
    floorDefs.forEach(f=>{
      const plainPiso = f.piso.replace('°','');
      f.codigos.forEach(codigo=>{
        const id = docId(f.piso, codigo);
        const data = unidadesCache[id];
        const contactos = (data && Array.isArray(data.contactos)) ? data.contactos : [];
        if(contactos.length === 0){
          lines.push([plainPiso, codigo, '', ''].join(','));
        } else {
          contactos.forEach(c=>{
            lines.push([plainPiso, codigo, c.whatsapp||'', c.telefono||''].join(','));
          });
        }
      });
    });
    const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'unidades-' + edificioId + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  // ---- Importar planilla CSV (carga masiva) ----
  function parseCSV(text){
    return text.split(/\r?\n/)
      .map(l=>l.trim())
      .filter(l=>l.length>0)
      .map(l=>l.split(',').map(c=>c.trim()));
  }

  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      const statusMsg = document.getElementById('statusMsg');
      const rows = parseCSV(reader.result);
      rows.shift(); // saca el encabezado

      const grupos = {}; // "piso|codigo" -> { piso, codigo, contactos:[] }
      const pisosDesconocidos = new Set();

      rows.forEach(cols=>{
        const [piso, codigo, whatsapp, telefono] = cols;
        if(!piso) return; // fila vacía o mal formada
        if(!floorLookup[piso]){ pisosDesconocidos.add(piso); return; }
        const key = piso + '|' + (codigo||'');
        if(!grupos[key]) grupos[key] = { piso, codigo:codigo||'', contactos:[] };
        if(whatsapp || telefono) grupos[key].contactos.push({ whatsapp:whatsapp||'', telefono:telefono||'' });
      });

      const claves = Object.keys(grupos);
      if(claves.length===0){
        statusMsg.textContent = 'No se encontraron filas válidas en el archivo.';
        return;
      }
      if(pisosDesconocidos.size>0){
        const seguir = confirm('Hay valores de "piso" que no reconozco: ' + Array.from(pisosDesconocidos).join(', ') + '.\nEsas filas se van a ignorar. ¿Continuar con el resto (' + claves.length + ' unidades)?');
        if(!seguir) return;
      } else {
        const seguir = confirm('Se van a actualizar ' + claves.length + ' unidades con los datos del archivo. ¿Confirmar?');
        if(!seguir) return;
      }

      statusMsg.textContent = 'Importando…';
      const batch = db.batch();
      claves.forEach(key=>{
        const g = grupos[key];
        const info = floorLookup[g.piso];
        const ref = edificioRef.collection('unidades').doc(docId(info.storedPiso, g.codigo));
        batch.set(ref, {
          piso: info.storedPiso,
          label: info.label,
          pisoOrden: info.pisoOrden,
          codigo: g.codigo,
          contactos: g.contactos,
        }, { merge:true });
      });
      try{
        await batch.commit();
        statusMsg.textContent = 'Importación lista: ' + claves.length + ' unidades actualizadas.';
      } catch(err){
        statusMsg.textContent = 'Error al importar: ' + err.message;
      }
      loadUnidades();
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // ---- Cargar y listar unidades ----
  const floorsEl = document.getElementById('floors');
  let unidadesCache = {}; // docId -> data

  function loadUnidades(){
    floorsEl.innerHTML = '<p class="status-msg">Cargando…</p>';
    edificioRef.collection('unidades').get().then(snap=>{
      unidadesCache = {};
      const porPiso = {};
      snap.forEach(doc=>{
        const d = doc.data();
        unidadesCache[doc.id] = d;
        if(!porPiso[d.piso]) porPiso[d.piso] = { piso:d.piso, label:d.label, pisoOrden:d.pisoOrden, unidades:[] };
        porPiso[d.piso].unidades.push({ id:doc.id, codigo:d.codigo||'', contactos:d.contactos||[] });
      });
      const floors = Object.values(porPiso).sort((a,b)=>a.pisoOrden-b.pisoOrden);
      floors.forEach(f=>f.unidades.sort((a,b)=>a.codigo.localeCompare(b.codigo)));

      floorsEl.innerHTML = '';
      if(floors.length===0){
        floorsEl.innerHTML = '<p class="status-msg">Todavía no hay unidades cargadas. Tocá "Inicializar estructura del edificio" para crearlas.</p>';
        return;
      }
      floors.forEach(f=>{
        const section = document.createElement('div');
        section.className = 'floor-section';
        const h2 = document.createElement('h2');
        h2.textContent = f.label;
        section.appendChild(h2);
        f.unidades.forEach(u=>{
          const row = document.createElement('div');
          row.className = 'unit-row';
          const n = u.contactos.length;
          const statusText = n===0 ? 'Sin contactos cargados' : (n===1 ? '1 contacto' : n+' contactos');
          const statusClass = n===0 ? 'empty' : 'ok';
          row.innerHTML =
            '<span class="code">'+f.piso+u.codigo+'</span>' +
            '<span class="status '+statusClass+'">'+statusText+'</span>' +
            '<span class="chev">›</span>';
          row.addEventListener('click', ()=>openModal(u.id, f.piso, u.codigo));
          section.appendChild(row);
        });
        floorsEl.appendChild(section);
      });
    }).catch(err=>{
      console.error(err);
      floorsEl.innerHTML = '<p class="status-msg">No se pudieron cargar las unidades: ' + err.message + '</p>';
    });
  }

  // ---- Modal de edición ----
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const contactosWrap = document.getElementById('contactosWrap');
  let editingId = null;

  function contactoRow(c){
    c = c || { whatsapp:'', telefono:'' };
    const row = document.createElement('div');
    row.className = 'contact-row';
    row.innerHTML =
      '<div class="fields">' +
        '<div class="field"><label>WhatsApp (ej: 5491122334455)</label><input type="text" class="in-whatsapp" value="'+(c.whatsapp||'')+'"></div>' +
        '<div class="field"><label>Teléfono (ej: +5491122334455)</label><input type="text" class="in-telefono" value="'+(c.telefono||'')+'"></div>' +
      '</div>' +
      '<button class="btn-danger" type="button" title="Quitar este contacto">✕</button>';
    row.querySelector('.btn-danger').addEventListener('click', ()=>row.remove());
    return row;
  }

  function openModal(id, piso, codigo){
    editingId = id;
    modalTitle.textContent = 'Piso ' + piso + (codigo ? ' · Depto ' + codigo : '');
    contactosWrap.innerHTML = '';
    const data = unidadesCache[id];
    const contactos = (data && data.contactos) || [];
    if(contactos.length===0){
      contactosWrap.appendChild(contactoRow());
    } else {
      contactos.forEach(c=>contactosWrap.appendChild(contactoRow(c)));
    }
    modalBackdrop.classList.add('open');
  }
  function closeModal(){ modalBackdrop.classList.remove('open'); editingId=null; }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', e=>{ if(e.target===modalBackdrop) closeModal(); });
  document.getElementById('addContactoBtn').addEventListener('click', ()=>contactosWrap.appendChild(contactoRow()));

  document.getElementById('modalSave').addEventListener('click', ()=>{
    const contactos = [];
    contactosWrap.querySelectorAll('.contact-row').forEach(row=>{
      const whatsapp = row.querySelector('.in-whatsapp').value.trim();
      const telefono = row.querySelector('.in-telefono').value.trim();
      if(whatsapp || telefono) contactos.push({ whatsapp, telefono });
    });
    edificioRef.collection('unidades').doc(editingId).update({ contactos }).then(()=>{
      closeModal();
      loadUnidades();
    }).catch(err=>{
      alert('No se pudo guardar: ' + err.message);
    });
  });
})();
</script>
</body>
</html>
